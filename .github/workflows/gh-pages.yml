name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Engine tests
        run: npm run cards && npm test
      - name: Build (cards/images -> public, Vite)
        # VITE_SERVER_URL: WebSocket URL of the lobby server (repository variable), e.g. wss://masters-of-pwnage.fly.dev/ws
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.LOBBY_SERVER_URL }}
          # Pages is another origin than the lobby server: no session cookie, so guest mode only.
          VITE_ACCOUNTS: "0"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
